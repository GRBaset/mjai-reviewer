[package]
name = "convlog"
version = "0.2.0"
authors = ["Equim <sayaka@ekyu.moe>"]
edition = "2024"

[dependencies]
serde_json = "1"
serde_tuple = "1"
serde_repr = "0.1"
thiserror = "2"
num_enum = "0.7"
ahash = "0.8"
serde_with = "3"
serde = { version = "1", features = ["derive"] }
sqlite = "0.36"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
bzip2 = "0.5"
quick-xml = { version = "0.37", features = ["serialize"] }
regex = "1.1"
urlencoding = "2.1.3"
lazy_static = "1.5.0"
flate2 = { version = "1.0.17", features = ["zlib-ng"], default-features = false }
eta = "0.2.2"
rayon = "1.10.0"
indicatif = {version = "*", features = ["rayon"]}
glob = "0.3.2"